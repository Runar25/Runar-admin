<!-- 2026-10-27 CODE-web: vlastní stránka „nenalezeno“ (audit po ownerově „na co jsi ještě nepřišel, protože jsi to neskontroloval?“).
     GitHub Pages ji vrací pro každou neexistující adresu na therunekeeper.com; do té doby tam stála obecná stránka GitHubu „File not
     found“ se zmínkou o GitHub Pages. Bez věty v jednom jazyce: 404 a odkaz domů (značka RÚNAR, jako v liště webu) pochopí každý.
     Cesty jsou absolutní (/img/…, /), protože stránka se ukazuje pod libovolnou adresou. -->
<link rel="icon" type="image/png" sizes="96x96" href="https://runar25.github.io/Runar-admin/v2/icons/favicon-96x96.png">
<link rel="stylesheet" href="https://runar25.github.io/Runar-admin/v2/fonts/fonts.css">
<style>
:root{--bg:#0a0c12;--gold:#FFBF00}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{min-height:100vh;background:var(--bg) radial-gradient(ellipse 120% 55% at 50% 0%,rgba(46,74,112,0.4) 0%,transparent 55%) no-repeat;
  color:var(--gold);font-family:'Cinzel',serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  padding:32px 16px;text-align:center}
/* portrét se rozplyne do stránky na všech čtyřech stranách — kruhová maska nechala na bocích ~64 % krytí a obrázek stál jako
   obdélník (2026-10-27); ruka je na 85 % šířky, proto pravý přechod až od 86 % */
img{width:min(280px,64vw);height:auto;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%),linear-gradient(180deg,transparent 0,#000 12%,#000 72%,transparent 100%);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%),linear-gradient(180deg,transparent 0,#000 12%,#000 72%,transparent 100%);mask-composite:intersect}
.n{font-size:54px;letter-spacing:14px;line-height:1;padding-left:14px}
a{font-size:12px;letter-spacing:3px;color:var(--gold);text-decoration:none;border:1px solid var(--gold);padding:12px 28px;transition:all .25s}
a:hover,a:focus-visible{background:var(--gold);color:#000}
</style>
</head>
<body>
<img src="/img/runar.jpg" alt="Rúnar the Rune Keeper">
<div class="n">404</div>
