<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Rúnakort · Rúnar</title>
<!-- 2026-10-19 CODE-web: digitální Rúnakort (DECISIONS 2026-10-19 (4)) — kupující nedostane holý kód, ale kartu, která vypadá jako
     fyzická: líc + rub, skutečný QR, tisk / uložení do PDF (stránka 85,6 × 54 mm na každou stranu).
     Údaje jsou v části adresy za # (#k=KÓD&v=o|f&l=is|en&n=SPÁR) — ta se na server neposílá, takže kód nekončí v žádném logu.
     Stránka kód NEOVĚŘUJE proti DB: veřejný dotaz „existuje kód?“ by šel zneužít k hádání kódů; platnost ověří až redeem-code v appce.
     Vzhledy karty = data v DESIGNS (owner: „teď máme černou a bílou, později můžou být další“). Texty a čísla z appky živě (UI_TEXT,
     VOCAB, CARD_PACKS, runeSvg) jako landing (§18, §20); nové věty jen tady v TXT.
     2026-10-20: kresba karty (vzhled i skládání líce/rubu) bydlí v ../runakort.css a ../runakort.js — sdílí ji stránka cesty. -->
<link rel="icon" type="image/png" sizes="96x96" href="https://runar25.github.io/Runar-admin/v2/icons/favicon-96x96.png">
<link rel="stylesheet" href="https://runar25.github.io/Runar-admin/v2/fonts/fonts.css">
<link rel="stylesheet" href="../runakort.css">
<style>
:root{--bg:#0a0c12;--gold:#FFBF00;--ember:#D6A85C;--white:#F2F5F7;--muted:#8ba5c0;--navy:#2E4A70;--wood:#7D5838;--ink:#1b2333}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--white);font-family:'Cormorant Garamond',serif;font-size:19px;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:22px 16px 40px}
.nav{width:100%;max-width:900px;display:flex;justify-content:space-between;align-items:center;font-family:'Cinzel',serif;font-size:13px;letter-spacing:4px;color:var(--gold);margin-bottom:28px}
.nav a{color:inherit;text-decoration:none}
.nav button{font:inherit;letter-spacing:3px;background:none;border:none;color:var(--gold);opacity:.55;cursor:pointer;padding:0;margin-left:14px}
.nav button.on{opacity:1}
.cards{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;width:100%;max-width:900px}
.tools{margin-top:30px;display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center}
.tools button{font-family:'Cinzel',serif;font-size:12px;letter-spacing:3px;border:1px solid #FFBF0080;background:none;color:var(--gold);padding:12px 20px;cursor:pointer;border-radius:2px}
.tools button.main{background:var(--gold);color:#000;border-color:var(--gold)}
.tools button.on{border-color:var(--gold);background:#FFBF0018}
.hint{margin-top:18px;color:var(--muted);font-style:italic;text-align:center;max-width:36em;line-height:1.5}
.miss{margin-top:60px;color:var(--white);font-size:22px;text-align:center}
@page{size:85.6mm 54mm;margin:0}
@media print{
  html,body{background:none}
  body{padding:0;display:block}
  .nav,.tools,.hint{display:none}
  .cards{display:block;max-width:none}
  .rk-wrap{width:85.6mm;height:54mm;break-after:page;page-break-after:always}
  .rk-wrap:last-child{break-after:auto;page-break-after:auto}
  html .cards .rk-card{border-radius:0;box-shadow:none;border:none;height:54mm}
}
</style>
</head>
<body>
<div class="nav"><a href="/">RÚNAR</a><span><button data-l="is">IS</button><button data-l="en">EN</button></span></div>
<div class="cards" id="cards"></div>
<div class="tools" id="tools">
  <span id="des"></span>
  <button class="main" id="print"></button>
</div>
<p class="hint" id="hint"></p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" integrity="sha384-mZT2gIty7ZDdOGkxfP6joZcYdMW1Jvj9dRlfpTmaJAKKXTqzygtB22k7FLe+KZC1" crossorigin="anonymous"></script>
<script src="https://runar25.github.io/Runar-admin/v2/runar-config.js"></script>
<script src="https://runar25.github.io/Runar-admin/v2/runar-runes.js"></script>
<script src="https://runar25.github.io/Runar-admin/v2/runar-translations.js"></script>
<script src="https://runar25.github.io/Runar-admin/v2/runar-svgs.js"></script>
<script src="https://runar25.github.io/Runar-admin/v2/runar-utils.js"></script>
<script src="../runakort.js"></script>
<script>
// Adresa appky — až přejde na app.therunekeeper.com, změní se jen tady (a na landingu).
var APP_URL = 'https://runar25.github.io/Runar-admin/v2/runar-reader.html';
var TXT = {
  print: { is: 'Prenta út eða vista sem PDF', en: 'Print or save as PDF' },
  hint:  { is: 'Kóðinn virkar einu sinni. Hver sem hefur hann getur notað hann. Gefðu hann því aðeins þeim sem á að fá kortið.',
           en: 'The code works once. Whoever has it can use it. So give it only to the person the card is for.' },
  miss:  { is: 'Í þessari slóð er enginn kóði.', en: 'This link has no card code.' }
};

var P = new URLSearchParams(location.hash.replace(/^#/, ''));
var CODE = (P.get('k') || '').trim().toUpperCase();
if (!/^[A-Z]{3,12}-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(CODE)) CODE = '';   // formát z makeCode() ve shrine
var DES = RK_DESIGNS[P.get('v')] ? P.get('v') : 'o';
var LANG = P.get('l') === 'en' ? 'en' : 'is';
var N = parseInt(P.get('n'), 10) || 0;

// QR vede do appky s kódem za # (#kort=…): appka ho předvyplní do pole kódu (runar-auth.js _kortZAdresy), uplatní ho člověk sám.
function qrSvg() {
  var q = qrcode(0, 'M');
  q.addData(APP_URL + '#kort=' + CODE);
  q.make();
  var m = q.getModuleCount(), d = '';
  for (var y = 0; y < m; y++) for (var x = 0; x < m; x++) if (q.isDark(y, x)) d += 'M' + x + ' ' + y + 'h1v1h-1z';
  return '<svg viewBox="0 0 ' + m + ' ' + m + '" shape-rendering="crispEdges"><path fill="#0c0f15" d="' + d + '"/></svg>';
}
function render() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('.nav button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-l') === LANG); });
  var cards = document.getElementById('cards');
  if (!CODE) {
    cards.innerHTML = '<p class="miss">' + TXT.miss[LANG] + '</p>';
    document.getElementById('tools').style.display = 'none';
    document.getElementById('hint').style.display = 'none';
    return;
  }
  cards.innerHTML = '<div class="rk-wrap">' + rkFront({ design: DES, lang: LANG, credits: N, code: CODE }) + '</div>'
    + '<div class="rk-wrap">' + rkBack({ design: DES, lang: LANG, code: CODE, qr: qrSvg() }) + '</div>';
  document.getElementById('des').innerHTML = Object.keys(RK_DESIGNS).map(function (k) {
    return '<button data-d="' + k + '" class="' + (k === DES ? 'on' : '') + '">' + RK_DESIGNS[k][LANG].toUpperCase() + '</button>';
  }).join(' ');
  document.querySelectorAll('[data-d]').forEach(function (b) {
    b.onclick = function () { DES = b.getAttribute('data-d'); save(); render(); };
  });
  document.getElementById('print').textContent = TXT.print[LANG].toUpperCase();
  document.getElementById('hint').textContent = TXT.hint[LANG];
}
// Přepnutí jazyka / vzhledu zapíše volbu zpět do # — odkaz, který se pošle dál, ukáže kartu tak, jak ji dárce viděl.
function save() {
  P.set('v', DES); P.set('l', LANG);
  history.replaceState(null, '', '#' + P.toString());
}
document.querySelectorAll('.nav button').forEach(function (b) {
  b.onclick = function () { LANG = b.getAttribute('data-l'); save(); render(); };
});
document.getElementById('print').onclick = function () { window.print(); };
render();
</script>
</body>
</html>
