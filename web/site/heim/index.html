<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Rúnar · The Rune Keeper</title>
<!-- 2026-10-21 CODE-web: domovská stránka webu PO SPUŠTĚNÍ (owner: „landingpage není potřeba, ale potřebujeme nějaký web pro Rúnara.
     Měl by být v podobě appky… pasovat i na rozlišení mobilu“; na návrh struktury „ano, postav ji“). Až se Rúnar spustí, nahradí
     stránku „Væntanlegt“ na therunekeeper.com; do té doby SKRYTÁ na /heim/ (noindex, nic na ni nevede).
     Web je vstup do appky a obchod — čtení se dělá jen v appce (adresy DECISIONS 2026-10-12 (6)).
     Vzhled = živé styly appky (runar-reader.css: lišta, hero s portrétem, .card, .btn-upgrade), texty z UI_TEXT (hero_eyebrow,
     hero_phrases, hero_quote, journey_*, sp_privacy_link), karta ze sdíleného runakort.js, adresa appky
     z web.js (§10, §20). Nové věty jen WEB_TXT: enter (IS „Gakktu inn“: Greynir OK, korpus 55×) a plans (2026-10-21, viz u WEB_TXT). -->
<link rel="icon" type="image/png" sizes="96x96" href="https://runar25.github.io/Runar-admin/v2/icons/favicon-96x96.png">
<link rel="stylesheet" href="https://runar25.github.io/Runar-admin/v2/fonts/fonts.css">
<link rel="stylesheet" href="https://runar25.github.io/Runar-admin/v2/runar-reader.css">
<link rel="stylesheet" href="https://runar25.github.io/Runar-admin/v2/runar-runakort.css">
<style>
/* jen to, co appka nemá: přepínač jazyka v liště, sloupec sekcí pod hero, tlačítka-odkazy a patička */
.w-lang button{font-family:'Cinzel',serif;font-size:0.72em;letter-spacing:3px;background:none;border:none;color:var(--gold);opacity:.5;cursor:pointer;margin-left:14px}
.w-lang button.on{opacity:.9}
.w-main{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:28px 16px 40px}
.w-main .card{text-align:center}
.w-main .card-lbl{margin-bottom:14px}
a.btn-upgrade{display:inline-block;text-decoration:none;margin-top:6px}
.hero-text-col a.btn-upgrade{align-self:flex-start}
.w-card{display:flex;justify-content:center;margin:6px 0 18px}
.w-card .rk-wrap{width:360px}
.w-foot{position:relative;z-index:1;text-align:center;font-family:'Cinzel',serif;font-size:11px;letter-spacing:2.5px;color:var(--muted);padding:20px 16px 36px;border-top:1px solid rgba(46,74,112,0.3)}
.w-foot a{color:inherit;text-decoration:none}
.w-foot a:hover{color:var(--gold)}
@media(max-width:768px){ .hero-text-col a.btn-upgrade{align-self:center} .w-path{display:none} }
/* desktop: Rúnar stojí vlevo, pravý panel se posouvá (owner 2026-10-27) */
@media(min-width:769px){
  .hero{border-bottom:none;overflow:visible;max-height:none}
  .hero-inner{display:block;max-width:none;min-height:0}
  .hero-portrait-col{position:fixed;left:0;top:50px;bottom:0;width:48vw;z-index:0}
  .hero-portrait-col{background:none}
  .hero-portrait-wrap::before,.hero-portrait-wrap::after{display:none}
  .hero-portrait-wrap img{-webkit-mask-image:linear-gradient(90deg,#000 58%,transparent 100%);mask-image:linear-gradient(90deg,#000 58%,transparent 100%)}
  .hero-text-col{margin-left:48vw;min-height:calc(100vh - 50px);padding:60px 6vw;justify-content:center}
  .hero-down{margin-left:48vw;width:auto}   /* 52vw přetékalo o šířku posuvníku (100vw ji počítá) */
  .w-main{margin:0 0 0 48vw;max-width:none;padding:24px 6vw 60px}
  .w-main .card{max-width:620px;margin-left:0}
  .w-foot{margin-left:48vw}
}
/* malá cesta kamenů (desktop): značka účtu, jméno, cena — kreslí kamenUctuSvg z runar-utils.js jako okno appky */
.w-path{list-style:none;margin:6px 0 16px;text-align:left}
.w-path li{display:grid;grid-template-columns:40px 1fr;column-gap:14px;align-items:center;padding:6px 0}
.w-path .kamen-uctu{width:34px;height:auto;cursor:pointer}
.w-path .nm{font-family:'Cinzel',serif;font-size:0.8em;letter-spacing:2px;color:var(--gold)}
.w-path .pr{font-style:italic;color:var(--muted);font-size:0.95em}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner">
  <a class="brand" id="w-brand">RÚNAR</a>
  <span class="w-lang"><button data-l="is">IS</button><button data-l="en">EN</button></span>
</div></header>

<section class="hero">
  <div class="hero-inner">
    <div class="hero-portrait-col">
      <div class="hero-portrait-wrap">
        <img src="../img/runar.jpg" alt="Rúnar the Rune Keeper">   <!-- ne ze Supabase Storage (egress, 2026-10-22) -->
      </div>
      <div class="hero-mob-label">
        <div class="hero-eyebrow" data-k="hero_eyebrow"></div>
        <div class="hero-title">Rúnar</div>
      </div>
      <blockquote class="hero-quote hero-quote-m" id="w-quote-m"></blockquote>   <!-- motto na mobilu u hlavy, jako appka -->
    </div>
    <div class="hero-text-col">
      <div class="hero-eyebrow hero-desk-only" data-k="hero_eyebrow"></div>
      <h1 class="hero-title hero-desk-only">Rúnar</h1>
      <p class="hero-sub" id="w-phrase"></p>
      <blockquote class="hero-quote" id="w-quote"></blockquote>
      <a class="btn-upgrade" id="w-enter"></a>
    </div>
  </div>
  <button type="button" class="hero-down" id="hero-down" onclick="scrollToReading()" aria-label="Scroll down">   <!-- proužek jako appka (2026-10-26) -->
    <svg viewBox="0 0 24 12" aria-hidden="true" focusable="false"><path d="M2 2l10 8 10-8"/></svg>
  </button>
</section>

<main class="w-main">
  <section class="card">
    <div class="card-lbl" data-k="journey_title"></div>
    <p class="note" id="w-journey-sub"></p>
    <ul class="w-path" id="w-path"></ul>
    <a class="btn-upgrade" id="w-journey" href="../ferdin/"></a>
  </section>
  <section class="card">
    <div class="card-lbl" id="w-card-h"></div>
    <div class="w-card"><div class="rk-wrap" id="w-card"></div></div>
    <p class="note" id="w-card-note"></p>
    <a class="btn-upgrade" id="w-card-go" href="../ferdin/#kort"></a>
  </section>
</main>

<footer class="w-foot">© 2026 AGNDOFA EHF. · <a href="mailto:runar@therunekeeper.com">RUNAR@THERUNEKEEPER.COM</a> · <a id="w-privacy" data-k="sp_privacy_link"></a></footer>

<script src="https://runar25.github.io/Runar-admin/v2/runar-config.js"></script>
<script src="https://runar25.github.io/Runar-admin/v2/runar-runes.js"></script>
<script src="https://runar25.github.io/Runar-admin/v2/runar-translations.js"></script>
<script src="https://runar25.github.io/Runar-admin/v2/runar-svgs.js"></script>
<script src="https://runar25.github.io/Runar-admin/v2/runar-utils.js"></script>
<script src="../web.js?v=7bbba3044e"></script>
<script src="https://runar25.github.io/Runar-admin/v2/runar-runakort.js"></script>
<script>
// plans (owner 2026-10-21 „ano, see plans“: dřív tlačítko opakovalo nadpis WALK WITH RÚNAR a „nic neříká“; rešerše Spotify „View all plans“).
// IS „Skoða áskriftarleiðir“: Greynir OK, „áskriftarleiðir“ 230×, „skoða leiðir“ 895×; infinitiv jako tlačítka appky (HEFJA LESTURINN).
var WEB_TXT = { enter: { is: 'GAKKTU INN', en: 'STEP INSIDE' }, plans: { is: 'SKOÐA ÁSKRIFTARLEIÐIR', en: 'SEE PLANS' } };
var LANG = 'is';
var lang = LANG;   // t()/tp() z runar-utils.js čtou globální `lang` (v appce ji drží runar-app.js, který web nenačítá)
var phraseIx = null;   // jedna náhodná věta z hero_phrases na návštěvu, jako appka (getHeroPhrase)
function render() {
  lang = LANG;
  var U = UI_TEXT[LANG];
  document.documentElement.lang = LANG;
  document.querySelectorAll('.w-lang button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-l') === LANG); });
  document.querySelectorAll('[data-k]').forEach(function (el) {
    var v = U[el.getAttribute('data-k')] || '';
    if (el.getAttribute('data-html')) el.innerHTML = v; else el.textContent = v;
  });
  document.getElementById('w-quote').innerHTML = webUvozovky(U.hero_quote, LANG);
  document.getElementById('w-quote-m').innerHTML = webUvozovky(U.hero_quote, LANG).replace(/<br\s*\/?>/g, ' ');
  var pool = U.hero_phrases || [];
  if (phraseIx === null) phraseIx = Math.floor(Math.random() * pool.length);
  document.getElementById('w-phrase').textContent = pool[phraseIx] || '';
  var enter = document.getElementById('w-enter');
  enter.textContent = WEB_TXT.enter[LANG] + ' →';
  enter.href = RUNAR_APP_URL;
  var hd = document.getElementById('hero-down');
  if (hd) hd.setAttribute('aria-label', U[hd.classList.contains('nahoru') ? 'hero_up_aria' : 'hero_down_aria'] || '');
  document.getElementById('w-brand').href = RUNAR_HOME_URL;
  document.getElementById('w-journey-sub').textContent = tp('journey_sub', { casts: vlp('cast', LANG) });
  document.getElementById('w-journey').textContent = WEB_TXT.plans[LANG] + ' →';
  cesta(U);
  document.getElementById('w-card-h').textContent = vl('card', LANG).toUpperCase();
  document.getElementById('w-card').innerHTML = rkFront({ design: 'o', lang: LANG, credits: CARD_PACKS[1].credits });
  document.getElementById('w-card-note').textContent = RK_TXT.note[LANG];
  document.getElementById('w-card-go').textContent = vl('card', LANG).toUpperCase() + ' →';
  document.getElementById('w-privacy').href = RUNAR_APP_URL.replace(/[^/]*$/, '') + 'runar-privacy.html';
}
// Malá cesta: čtyři účty v pořadí okna appky; ceny z TIERS.price_isk_month, texty zdarma z UI_TEXT (journey_free / _free_join)
function cesta(U) {
  var cislo = function (x) { return x.toLocaleString('de-DE'); };
  document.getElementById('w-path').innerHTML = ['free_trial', 'rune_seeker', 'standard', 'premium'].map(function (id) {
    var TI = TIERS[id], m = TI.price_isk_month;
    var pr = m ? tp('journey_price_m', { price: cislo(m) }) : ({ free_trial: U.journey_free, rune_seeker: U.journey_free_join }[id] || '');
    return '<li>' + kamenUctuSvg(id) + '<div><div class="nm">' + (LANG === 'is' ? TI.label_is : TI.label).toUpperCase() + '</div><div class="pr">' + pr + '</div></div></li>';
  }).join('');
  var p = document.getElementById('w-path');
  if (getComputedStyle(p).display !== 'none') kamenUctuVystred(p);   // getBBox jen na viditelném prvku (na mobilu je skrytá)
  p.querySelectorAll('.kamen-uctu').forEach(function (svg) { svg.onclick = function () { kamenUctuOziv(svg, 5000); }; });
}
document.querySelectorAll('.w-lang button').forEach(function (b) {
  b.onclick = function () { LANG = b.getAttribute('data-l'); render(); };
});
render();
</script>
</body>
</html>
