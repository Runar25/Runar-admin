<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rúnar · The Rune Keeper</title>
<!-- web/site = PŘESNĚ to, co jde na therunekeeper.com (repo Runar25/therunekeeper-web je jen kopie téhle složky; měnit se smí jen tady).
     2026-10-12/13 CODE-web: landing „coming soon“ — styl A (Noc) + „Væntanlegt“ v bronzu přezky (owner „bronze je dobrý“).
     Texty hero_eyebrow / hero_quote / sp_privacy_link / redeem_err_rate / err_generic, config (SB_URL) a písma bere ŽIVĚ z appky
     (GitHub Pages posílá Access-Control-Allow-Origin: *), ať nejsou na dvou místech (§18, §20). Až appka přejde na
     app.therunekeeper.com, změní se jen konstanta adresy appky níž a v <head>. Registrace → edge funkce waitlist-join (Brevo, dvojí potvrzení).
     Patička: údaje firmy podle zákona 30/2002 (owner 2026-10-13: Brekkugata 38, 600 Akureyri; kt. z agndofa.is/pages/contact); VSK doplní owner. -->
<link rel="icon" type="image/png" sizes="96x96" href="https://runar25.github.io/Runar-admin/v2/icons/favicon-96x96.png">
<link rel="apple-touch-icon" href="https://runar25.github.io/Runar-admin/v2/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://runar25.github.io/Runar-admin/v2/fonts/fonts.css">
<style>
:root{--bg:#0a0c12;--gold:#FFBF00;--white:#F2F5F7;--muted:#8ba5c0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--white);font-family:'Cormorant Garamond',serif;font-size:19px}
.hero{position:relative;height:100vh;min-height:640px;max-height:900px;overflow:hidden;display:flex;align-items:center;
  background:radial-gradient(ellipse at 20% 30%,#123a3a 0%,transparent 45%),linear-gradient(90deg,#0b0d12,#0a0c12)}
.art{position:absolute;left:0;top:0;bottom:0;width:52%;background:url(img/runar.jpg) 30% 22%/cover no-repeat;
  -webkit-mask-image:linear-gradient(90deg,#000 62%,transparent 100%);mask-image:linear-gradient(90deg,#000 62%,transparent 100%)}
.nav{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:24px 44px;z-index:4;
  font-family:'Cinzel',serif;font-size:13px;letter-spacing:4px;color:var(--gold)}
.nav .r{display:flex;gap:18px;align-items:center}
.nav button{font:inherit;letter-spacing:3px;background:none;border:none;color:var(--gold);opacity:.55;cursor:pointer;padding:0}
.nav button.on{opacity:1}
.txt{position:relative;z-index:3;margin-left:54%;padding:0 44px}
.eyebrow{font-family:'Cinzel',serif;font-size:14px;letter-spacing:5px;color:var(--gold);margin-bottom:12px}
.title{font-family:'Cinzel',serif;font-size:66px;letter-spacing:6px;line-height:1;color:var(--gold);margin-bottom:22px}
/* bronz přezky a kování hole: kovový přechod, ne plochá barva (plochá působila přilepeně) */
.bronze{font-family:'Cinzel',serif;font-size:30px;letter-spacing:9px;margin:2px 0 26px;
  background:linear-gradient(180deg,#f6dca0 0%,#c8964a 38%,#7a5426 62%,#d9ad62 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 0 #000) drop-shadow(0 0 10px #c8964a40)}
.quote{font-style:italic;font-size:23px;line-height:1.5;white-space:nowrap;padding-left:18px;border-left:1px solid var(--gold);margin-bottom:30px}
.wait{display:flex;max-width:430px;border:1px solid #FFBF0066}
.wait input{flex:1;min-width:0;background:transparent;border:none;color:var(--white);font-family:'Cormorant Garamond',serif;font-size:18px;padding:13px 16px;outline:none}
.wait input::placeholder{color:var(--muted)}
.wait button{font-family:'Cinzel',serif;font-size:12px;letter-spacing:3px;background:var(--gold);color:#000;border:none;padding:0 20px;cursor:pointer}
.fine{font-size:16px;color:#b9c8d8;margin-top:10px;font-style:italic}
.foot{position:absolute;bottom:18px;left:0;right:0;padding:0 16px;text-align:center;font-family:'Cinzel',serif;font-size:10px;letter-spacing:3px;line-height:1.9;color:#D6A85CCC;z-index:4}
.foot a{color:inherit;text-decoration:underline;text-underline-offset:3px}
@media(max-width:820px){
  .hero{height:auto;max-height:none;flex-direction:column;align-items:stretch}
  .art{position:relative;width:100%;height:56vh;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
  .txt{margin:0;padding:10px 16px 130px}
  .nav{padding:16px}
  .title{font-size:46px}.bronze{font-size:24px;letter-spacing:7px}.quote{white-space:normal;font-size:20px}
}
</style>
</head>
<body>
<section class="hero">
  <div class="art"></div>
  <div class="nav"><span></span><span class="r"><button data-l="is" class="on">IS</button><button data-l="en">EN</button><span style="opacity:.75">AGNDOFA</span></span></div>
  <div class="txt">
    <div class="eyebrow" data-k="hero_eyebrow"></div>
    <div class="title">RÚNAR</div>
    <div class="bronze" data-is="VÆNTANLEGT" data-en="COMING SOON"></div>
    <div class="quote" data-k="hero_quote"></div>
    <form class="wait" id="wait" novalidate><input id="wl-email" data-ph="1" type="email" autocomplete="email" required><input name="website" id="wl-hp" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px"><button id="wl-btn" data-is="SKRÁÐU ÞIG HÉR" data-en="REGISTER HERE"></button></form>
    <div class="fine" id="wl-msg" role="status" aria-live="polite" style="display:none;color:#F2F5F7;font-style:normal"></div>
    <div class="fine" data-is="Skráðu þig núna og þú færð tölvupóst þegar Rúnar fer í loftið." data-en="Register now and you will get an email when Rúnar launches."></div>
  </div>
  <div class="foot">AGNDOFA EHF. · BREKKUGATA 38 · 600 AKUREYRI · KT. 540312-1170 · <a href="mailto:info@agndofa.is">INFO@AGNDOFA.IS</a><br><a href="https://runar25.github.io/Runar-admin/v2/runar-privacy.html" data-k="sp_privacy_link"></a> · © 2026 AGNDOFA EHF.</div>
</section>
<script src="https://runar25.github.io/Runar-admin/v2/runar-config.js"></script>
<script src="https://runar25.github.io/Runar-admin/v2/runar-translations.js"></script>
<script>
var LANG = 'is';
var PH = { is: 'Netfangið þitt', en: 'Your email' };
function render() {
  var T = UI_TEXT[LANG];
  document.querySelectorAll('[data-k]').forEach(function (el) {
    var k = el.getAttribute('data-k'), v = T[k] || '';
    if (k === 'hero_quote') { v = v.replace(/^"|"$/g, ''); v = (LANG === 'is' ? '„' : '“') + v + (LANG === 'is' ? '“' : '”'); }
    el.innerHTML = v;
  });
  document.querySelectorAll('[data-is]').forEach(function (el) { el.textContent = el.getAttribute('data-' + LANG); });
  document.querySelectorAll('[data-ph]').forEach(function (el) { el.placeholder = PH[LANG]; });
  document.documentElement.lang = LANG;
}
document.querySelectorAll('.nav button').forEach(function (b) {
  b.onclick = function () {
    LANG = b.getAttribute('data-l');
    document.querySelectorAll('.nav button').forEach(function (x) { x.classList.toggle('on', x === b); });
    render();
  };
});
// Registrace → edge funkce waitlist-join (Brevo, dvojí potvrzení). Adresa projektu z runar-config.js (SB_URL), ne natvrdo.
var WL = {
  sent:  { is: 'Takk. Staðfestu netfangið í tölvupóstinum sem við sendum þér.', en: 'Thank you. Confirm your email in the message we sent you.' },
  done:  { is: 'Netfangið þitt er staðfest. Við látum þig vita þegar Rúnar fer í loftið.', en: 'Your email is confirmed. We will let you know when Rúnar launches.' },
  bad:   { is: 'Netfangið lítur ekki rétt út.', en: 'That email address does not look right.' }
};
var wlState = location.search.indexOf('registered=1') >= 0 ? 'done' : null;
function wlShow() {
  var m = document.getElementById('wl-msg');
  if (!wlState) { m.style.display = 'none'; return; }
  var T = UI_TEXT[LANG];
  m.textContent = WL[wlState] ? WL[wlState][LANG] : (wlState === 'rate' ? T.redeem_err_rate : T.err_generic);
  m.style.display = '';
}
document.getElementById('wait').addEventListener('submit', function (e) {
  e.preventDefault();
  var email = document.getElementById('wl-email').value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { wlState = 'bad'; wlShow(); return; }
  var btn = document.getElementById('wl-btn'); btn.disabled = true;
  fetch(SB_URL + '/functions/v1/waitlist-join', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, website: document.getElementById('wl-hp').value })
  }).then(function (r) {
    wlState = r.ok ? 'sent' : r.status === 400 ? 'bad' : r.status === 429 ? 'rate' : 'err';
  }).catch(function () { wlState = 'err'; }).then(function () {
    btn.disabled = false; wlShow();
    if (wlState === 'sent') document.getElementById('wl-email').value = '';
  });
});
var _render = render;
render = function () { _render(); wlShow(); };
render();
</script>
</body>
</html>
