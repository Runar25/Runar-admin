<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The journey with Rúnar · preview</title>
<!-- 2026-10-19 CODE-web: NÁHLED stránky „The journey with Rúnar“ (DECISIONS 2026-10-19 (7)) — nevydává se, vzhled okna v appce čeká na ownera.
     Verze 2 (týž den): owner k verzi 1 *„grafika neodpovídá tomu, co je Rúnar. načti si, jak přesně jsme dělali visual“* — verze 1 měla
     vlastní vymyšlené styly (sloupce vedle sebe, vlastní písmo a odstupy). Teď stránka načítá ŽIVÉ styly appky (runar-reader.css) a staví
     jen z jejích tříd: lišta, hero s portrétem, sloupec .app, .card + .card-lbl, přepínač .reading-mode-row, .btn-full / .btn-full.sec, .note
     (paměť match-existing-visual-first). Vlastní CSS jen na cenu a řádky balíčků, z tokenů appky.
     Texty jen EN a pracovní z ukázky CODE-read (docs/inbox/2026-10-19-okno-upgrade-ukazka.html); IS jednou sadou s oknem (§2).
     Výpis účtu = tierFeatures(), jména TIERS, balíčky CARD_PACKS — živě z appky (§10, §20).
     CENY PŘEDPLATNÉHO DOČASNĚ z RUNAR_PRICING „Subscription Pricing“ (PRICE_DRAFT), do configu je přesune CODE-tune. -->
<link rel="stylesheet" href="https://runar25.github.io/Runar-admin/v2/fonts/fonts.css">
<link rel="stylesheet" href="https://runar25.github.io/Runar-admin/v2/runar-reader.css">
<style>
/* jen to, co appka nemá: cena účtu a řádek balíčku karty — hodnoty z tokenů appky */
.price{font-family:'Cinzel',serif;font-size:1.3em;letter-spacing:1px;color:var(--white);margin:-6px 0 2px;}
.price small{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.72em;letter-spacing:0;color:var(--muted);}
.gift{font-style:italic;color:var(--gold);opacity:0.85;font-size:0.95em;margin-bottom:12px;}
.feat{list-style:none;margin:12px 0 4px;}
.feat li{font-size:1.02em;line-height:1.6;color:var(--white);margin-bottom:4px;}
.pack{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-bottom:1px solid rgba(46,74,112,0.4);}
.pack:last-of-type{border-bottom:none;}
.pack .nm{font-family:'Cinzel',serif;font-size:0.72em;letter-spacing:2px;color:var(--gold);}
.pack .c{font-style:italic;color:var(--muted);}
.pack .p{font-family:'Cinzel',serif;font-size:0.9em;color:var(--white);}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner">
  <a class="brand" href="../site/">AGNDOFA</a>
</div></header>

<section class="hero">
  <div class="hero-inner">
    <div class="hero-portrait-col">
      <div class="hero-portrait-wrap">
        <img src="https://pmitxjvkeovijreepror.supabase.co/storage/v1/object/public/runar-images/Runar_portrait.png" alt="Rúnar the Rune Keeper">
      </div>
      <div class="hero-mob-label">
        <div class="hero-eyebrow">YOUR JOURNEY WITH RÚNAR</div>
        <div class="hero-title">Rúnar</div>
      </div>
    </div>
    <div class="hero-text-col">
      <div class="hero-eyebrow hero-desk-only">YOUR JOURNEY WITH RÚNAR</div>
      <h1 class="hero-title hero-desk-only">Rúnar</h1>
      <p class="hero-sub">Each step holds more of Rúnar. Walk as far as you wish, and step back whenever you like.</p>
      <blockquote class="hero-quote" id="hero-quote"></blockquote>
    </div>
  </div>
</section>

<div class="app">
  <div class="reading-mode-row" id="per">
    <button class="reading-mode-btn active" data-p="m">MONTHLY</button>
    <button class="reading-mode-btn" data-p="y">YEARLY</button>
  </div>
  <div id="path"></div>
  <div class="card">
    <div class="card-lbl" id="card-h"></div>
    <p class="note">No subscription and no expiry. For yourself, or as a gift.</p>
    <div id="packs"></div>
    <button class="btn-full sec" disabled>COMING SOON</button>
  </div>
  <p class="note" style="text-align:center;">Prices in Icelandic krónur. Cancel any time.</p>
</div>

<script src="https://runar25.github.io/Runar-admin/v2/runar-config.js"></script>
<script src="https://runar25.github.io/Runar-admin/v2/runar-runes.js"></script>
<script src="https://runar25.github.io/Runar-admin/v2/runar-translations.js"></script>
<script src="https://runar25.github.io/Runar-admin/v2/runar-svgs.js"></script>
<script src="https://runar25.github.io/Runar-admin/v2/runar-utils.js"></script>
<script>
// DOČASNĚ: ceny z RUNAR_PRICING „Subscription Pricing“, dokud nejsou v configu (CODE-tune). Na web nejdou odsud.
var PRICE_DRAFT = { standard: { m: 3490, y: 34800 }, premium: { m: 4900, y: 49000 } };
var LANG = 'en', P = 'm';
// Návštěvník nemá v tierFeatures() žádný řádek (nemá účet) → pracovní věta z ukázky okna CODE-read
var VISITOR_EN = ['The Runes Collection and your life rune.'];
var ORDER = ['free_trial', 'rune_seeker', 'standard', 'premium'];
function kr(x) { return x.toLocaleString('de-DE') + ' kr'; }   // tečka na tisíce jako v ukázce okna (1.490 kr)
function draw() {
  document.getElementById('path').innerHTML = ORDER.map(function (id) {
    var T = TIERS[id], pr = PRICE_DRAFT[id], h = '<div class="card"><div class="card-lbl">✦ ' + T.label.toUpperCase() + '</div>';
    if (pr) {
      h += P === 'm' ? '<div class="price">' + kr(pr.m) + ' <small>a month</small></div>'
                     : '<div class="price">' + kr(Math.round(pr.y / 12)) + ' <small>a month, ' + kr(pr.y) + ' a year</small></div><div class="gift">Two months are a gift.</div>';
    } else {
      h += '<div class="price"><small>' + (id === 'free_trial' ? 'Free' : 'Free to join') + '</small></div>';
    }
    var f = id === 'free_trial' ? VISITOR_EN : tierFeatures(id, LANG);
    h += '<ul class="feat">' + f.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>';
    if (pr) h += '<button class="btn-full" disabled>WALK ON AS ' + T.label.replace(/^Rune\s+/, '').toUpperCase() + '</button><p class="note" style="text-align:center;margin:10px 0 0;">Coming soon.</p>';
    else if (id === 'rune_seeker') h += '<button class="btn-full sec">BECOME A ' + T.label.toUpperCase() + '</button>';
    return h + '</div>';
  }).join('');
}
document.getElementById('hero-quote').innerHTML = UI_TEXT[LANG].hero_quote || '';
document.getElementById('card-h').textContent = '✦ ' + VOCAB.card.en.toUpperCase();
document.getElementById('packs').innerHTML = CARD_PACKS.map(function (p) {
  return '<div class="pack"><span class="nm">' + cardPackName(p, LANG).toUpperCase() + '</span><span class="c">' + vn('cast', p.credits, LANG) + '</span><span class="p">' + kr(p.isk) + '</span></div>';
}).join('');
document.querySelectorAll('#per button').forEach(function (b) {
  b.onclick = function () { P = b.dataset.p; document.querySelectorAll('#per button').forEach(function (x) { x.classList.toggle('active', x === b); }); draw(); };
});
draw();
</script>
</body>
</html>
