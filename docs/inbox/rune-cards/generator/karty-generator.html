<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generátor runových karet</title>
<style>
:root{--bg:#f4f3f0;--panel:#fff;--line:#d9d6cf;--txt:#222;--muted:#777;--acc:#d2541b;--acc2:#2a6fd1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.35 system-ui,Segoe UI,sans-serif}
#top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#top b{font-size:14px;margin-right:8px}
#gallery{display:flex;gap:10px;padding:6px 10px;overflow-x:auto;background:#ebe9e4;border-bottom:1px solid var(--line)}
.aett{display:flex;flex-direction:column;gap:2px}
.aett span{font-size:11px;color:var(--muted)}
.aett div{display:flex;gap:3px}
.th{cursor:pointer;border:2px solid transparent;border-radius:4px;background:#fff;padding:1px;text-align:center;font-size:10px;width:52px}
.th.on{border-color:var(--acc)}
.th.new{display:flex;flex-direction:column;justify-content:center;font-size:13px;color:var(--acc2);border:2px dashed #9bb7e0;min-height:74px}
button.fillon{background:#d2541b;color:#fff;border-color:#d2541b;font-weight:600}
.undo button{font-size:14px;padding:5px 12px;font-weight:600}
#top button[data-act=undo]{font-size:14px;padding:4px 12px;font-weight:600}
.th svg{display:block;width:46px;height:auto;margin:auto}
#main{display:flex;height:calc(100vh - 128px);min-height:500px}
#stage{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;min-width:0}
#cv{height:100%;max-height:calc(100vh - 175px);max-width:100%;background:#fff;box-shadow:0 1px 4px #0002;touch-action:none;user-select:none}
#hint{font-size:11px;color:var(--muted);padding-top:4px;text-align:center}
#panel{width:600px;max-width:55vw;overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:8px 10px}
h3{margin:12px 0 4px;font-size:13px}
details{border:1px solid var(--line);border-radius:4px;padding:4px 8px;margin-bottom:6px}
summary{cursor:pointer;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;margin-top:6px}
.grid label{display:flex;justify-content:space-between;gap:4px;align-items:center;font-size:12px}
.grid input,.grid select{width:64px}
table{border-collapse:collapse;width:100%;margin-top:4px}
td,th{border-bottom:1px solid #eee;padding:2px 3px;text-align:left;vertical-align:middle;font-size:12px}
th{font-weight:600;color:var(--muted);font-size:11px}
tr.sel td{background:#fde9df}
input[type=number]{width:62px}
td.common{color:var(--acc2);font-size:11px}
button{font:inherit;font-size:12px;padding:2px 7px;border:1px solid #bbb;background:#fafafa;border-radius:3px;cursor:pointer}
button:hover{background:#eee}
.btns{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.err{color:#b00}
.muted{color:var(--muted);font-size:11px}
label.chk{font-size:12px;display:inline-flex;gap:3px;align-items:center}
</style>
</head>
<body>
<div id="top">
  <b>Generátor runových karet</b>
  <button data-act="undo" title="Ctrl+Z">↶ Krok zpět</button>
  <button data-act="redo" title="Ctrl+Y">↷ Krok vpřed</button>
  <button data-act="newRune">＋ Nová runa</button>
  <span style="width:10px"></span>
  <button data-act="expOne">Export SVG (tahle runa)</button>
  <button data-act="expAll">Export SVG (všech 25 na arch)</button>
  <button data-act="expEach">Export SVG (každá zvlášť)</button>
  <span style="width:10px"></span>
  <button data-act="saveJson">Uložit práci (.json)</button>
  <label class="chk"><button data-act="loadJson">Načíst práci</button><input type="file" id="fJson" accept=".json" hidden></label>
  <span style="width:10px"></span>
  <label class="chk">Podložit obrázek <input type="file" id="fImg" accept="image/*" style="width:160px"></label>
  <label class="chk">průhlednost <input type="range" id="imgOp" min="0" max="1" step="0.05" value="0.4" style="width:70px"></label>
</div>
<div id="gallery"></div>
<div id="main">
  <div id="stage">
    <svg id="cv"></svg>
    <div id="hint">Dvojklik na pás mezi dvěma čarami = vyplnit úsek runou (znovu = smazat) · Táhni čáru myší = posun · Shift + táhni = otáčení kolem kotvy · šipky = posun vybrané o 0,1 mm (Shift 1 mm) · [ a ] = úhel ±0,5° · Ctrl+Z zpět</div>
  </div>
  <div id="panel"></div>
</div>
<script>
'use strict';
/* ====== Runy a výchozí hodnoty ====== */
const RUNES=[["Freyin ætt",['Fehu','Uruz','Thurisaz','Ansuz','Raidho','Kenaz','Gebo','Wunjo']],
             ["Heimdallův ætt",['Hagalaz','Nauthiz','Isa','Jera','Eihwaz','Perthro','Algiz','Sowilo']],
             ["Týrův ætt",['Tiwaz','Berkana','Ehwaz','Mannaz','Laguz','Ingwaz','Dagaz','Othala']],
             ["prázdná",['Blank']]];
const BASE=RUNES.flatMap(g=>g[1]);
const ALLF=()=>BASE.concat(st.custom||[]);
// Karta 65 × 100 mm; rám a měřítko odpovídají předloze pro_form.svg (687 × 1024 px → 65 mm na šířku).
const DECK0={cardW:65,cardH:100,mL:9.9,mR:9.9,mT:9.7,mB:27,radius:0,inner:1.6,frameW:0.4,origin:'frame',
  bandW:1.6,bandN:2,bandS:0.35,thinS:0.6,runeStyle:'center',gap:0.35,ink:'#000000',bg:'#ffffff'};
const L=(id,type,x,y,a,extra)=>Object.assign({id,type,x,y,a,ref:'',off:0},extra||{});
const S=(on,from,to)=>({on,from,to});
const ln=(id,edge)=>({kind:'line',id,edge:edge||'mid'});
const at=t=>({kind:'len',t});
// Předlohy podle ukázek (souřadnice v mm od středu rámu, y nahoru, úhel od vodorovné, + = stoupá doprava)
const PRESETS={
 Berkana:{lines:[L('V','pas',-6,0,90),L('D1','pas',-6,18.5,-28),L('D2','pas',-6,6.5,28),L('D3','pas',-6,6.5,-28),L('D4','pas',-6,-5.5,28)],
   strokes:[S('V',ln('D1','far'),ln('D4','far')),S('D1',ln('V'),ln('D2','far')),S('D2',ln('V'),ln('D1','far')),S('D3',ln('V'),ln('D4','far')),S('D4',ln('V'),ln('D3','far'))]},
 Raidho:{lines:[L('V','pas',-6,0,90),L('D1','pas',-6,18.5,-28),L('D2','pas',-6,6.5,28),L('D3','pas',-6,6.5,-28),L('T','cara',-6,-5.5,28)],
   strokes:[S('V',ln('D1','far'),ln('T')),S('D1',ln('V'),ln('D2','far')),S('D2',ln('V'),ln('D1','far')),S('D3',ln('V'),ln('T'))]},
 Tiwaz:{lines:[L('V','pas',0,0,90),L('AL','pas',0,18,28),L('AR','pas',0,18,-28),L('T','cara',0,-13,28)],
   strokes:[S('V',ln('AL'),ln('T')),S('AL',ln('V'),at(-13)),S('AR',ln('V'),at(13))]},
 Uruz:{lines:[L('V1','pas',-7.5,0,90),L('V2','pas',0,0,90,{ref:'V1',off:10.2}),L('D','pas',-7.5,20,-31),L('T','cara',-7.5,-17.2,31)],
   strokes:[S('V1',ln('D','far'),ln('T')),S('D',ln('V1','far'),ln('V2','far')),S('V2',ln('D','far'),ln('T'))]}
};
const KEY='runove-karty-generator-v1';
const clone=o=>JSON.parse(JSON.stringify(o));
function fresh(){return {deck:{...DECK0},runes:Object.fromEntries(BASE.map(n=>[n,PRESETS[n]?clone(PRESETS[n]):{lines:[],strokes:[]}])),cur:"Berkana",custom:[]};}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.runes&&s.deck){s.deck={...DECK0,...s.deck};BASE.concat(s.custom||[]).forEach(n=>{if(!s.runes[n])s.runes[n]={lines:[],strokes:[]}});return s;}}catch(e){}return null;}
let st=load()||fresh();
const ui={sel:null,ghost:'',all:false,common:true,labels:true,grid:false,img:null,imgRatio:1,imgOp:0.4};
const hist=[JSON.stringify(st)];let hi=0;
function commit(){const s=JSON.stringify(st);if(s===hist[hi])return;hist.splice(hi+1);hist.push(s);if(hist.length>200)hist.shift();hi=hist.length-1;try{localStorage.setItem(KEY,s)}catch(e){}}
function undo(d){const j=hi+d;if(j<0||j>=hist.length)return;hi=j;st=JSON.parse(hist[hi]);try{localStorage.setItem(KEY,hist[hi])}catch(e){}refreshAll();}
const cur=()=>st.runes[st.cur];

/* ====== Geometrie (mm, počátek ve středu, y nahoru) ====== */
const rad=d=>d*Math.PI/180, dot=(a,b)=>a[0]*b[0]+a[1]*b[1], add=(a,b)=>[a[0]+b[0],a[1]+b[1]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1]], mul=(a,k)=>[a[0]*k,a[1]*k];
const f3=n=>+(+n).toFixed(3);
function org(){const D=st.deck;return D.origin==='card'?{ox:D.cardW/2,oy:D.cardH/2}:{ox:D.mL+(D.cardW-D.mL-D.mR)/2,oy:D.mT+(D.cardH-D.mT-D.mB)/2};}
function rectM(){const D=st.deck,O=org();return {x0:D.mL-O.ox,x1:D.cardW-D.mR-O.ox,y0:O.oy-(D.cardH-D.mB),y1:O.oy-D.mT};}
function geom(r){
  const D=st.deck,by={},G={};r.lines.forEach(l=>by[l.id]=l);
  function get(id,depth){
    if(G[id])return G[id];const l=by[id];if(!l||depth>40)return null;
    let P=[+l.x||0,+l.y||0],a=+l.a||0,ref=null;
    if(l.ref&&by[l.ref]&&l.ref!==id){ref=get(l.ref,depth+1);if(ref){a=ref.a;P=add(ref.P,mul(ref.n,+l.off||0));}}
    const u=[Math.cos(rad(a)),Math.sin(rad(a))];let n=[-u[1],u[0]];
    const steep=Math.abs(u[1])>Math.abs(u[0])+1e-9;
    if(steep?n[0]<0:n[1]<0)n=[-n[0],-n[1]];   // + posun = doprava u strmých, nahoru u plochých
    const h=l.type==='pas'?D.bandW/2+D.bandS/2:D.thinS/2;
    return G[id]={id,P,a,u,n,h,type:l.type,l};
  }
  r.lines.forEach(l=>get(l.id,0));return G;
}
function segClip(P,u,R){let t0=-1e4,t1=1e4;for(const [p,d,lo,hi] of [[P[0],u[0],R.x0,R.x1],[P[1],u[1],R.y0,R.y1]]){if(Math.abs(d)<1e-12){if(p<lo||p>hi)return null;}else{let a=(lo-p)/d,b=(hi-p)/d;if(a>b)[a,b]=[b,a];t0=Math.max(t0,a);t1=Math.min(t1,b);}}return t0<t1?[t0,t1]:null;}
function clipHP(poly,f){const out=[];for(let i=0;i<poly.length;i++){const A=poly[i],B=poly[(i+1)%poly.length],fa=f(A),fb=f(B);if(fa>=0)out.push(A);if((fa>=0)!==(fb>=0)){const t=fa/(fa-fb);out.push([A[0]+t*(B[0]-A[0]),A[1]+t*(B[1]-A[1])]);}}return out;}
function clipRect(poly,R){for(const f of [p=>p[0]-R.x0,p=>R.x1-p[0],p=>p[1]-R.y0,p=>R.y1-p[1]])poly=clipHP(poly,f);return poly;}
function tOn(Lg,st0,G){if(st0.kind==='len')return +st0.t||0;const M=G[st0.id];if(!M||M===Lg)return null;const den=dot(M.n,Lg.u);if(Math.abs(den)<1e-9)return null;return dot(M.n,sub(M.P,Lg.P))/den;}
// Tah runy = pás na čáře `on`, oříznutý dvěma zarážkami (jinou čarou nebo bodem na čáře)
function strokeShape(s,G,R,joined){
  const D=st.deck,Lg=G[s.on];if(!Lg)return {err:'chybí čára '+s.on};
  const tA=tOn(Lg,s.from,G),tB=tOn(Lg,s.to,G);
  if(tA==null||tB==null)return {err:'zarážka je rovnoběžná nebo neexistuje'};
  const Q=add(Lg.P,mul(Lg.u,(tA+tB)/2)),h=Lg.h,BIG=500;
  let poly=[add(add(Lg.P,mul(Lg.u,-BIG)),mul(Lg.n,h)),add(add(Lg.P,mul(Lg.u,BIG)),mul(Lg.n,h)),add(add(Lg.P,mul(Lg.u,BIG)),mul(Lg.n,-h)),add(add(Lg.P,mul(Lg.u,-BIG)),mul(Lg.n,-h))];
  const ct=[];
  for(const [sp,tS,tO] of [[s.from,tA,tB],[s.to,tB,tA]]){
    const dir=Math.sign(tO-tS)||1;let f,tCut,join=false;
    if(sp.kind==='len'){const X=add(Lg.P,mul(Lg.u,tS));f=p=>dir*dot(Lg.u,sub(p,X));tCut=tS;}
    else{const M=G[sp.id];const sQ=Math.sign(dot(M.n,sub(Q,M.P)))||1;
      const d=sp.edge==='near'?sQ*M.h:sp.edge==='far'?-sQ*M.h:0;const M0=add(M.P,mul(M.n,d));
      f=p=>sQ*dot(M.n,sub(p,M0));tCut=dot(M.n,sub(M0,Lg.P))/dot(M.n,Lg.u);join=joined.has(sp.id);}
    poly=clipHP(poly,f);
    ct.push(join?tS:tCut+dir*h);           // středová linka: ve spoji až do průsečíku, na konci kousek před řezem
  }
  poly=clipRect(poly,R);
  let c=null;
  if(D.runeStyle==='center'&&(ct[1]-ct[0])*(tB-tA)>0){const cl=segClip(Lg.P,Lg.u,R);if(cl){let a=Math.min(ct[0],ct[1]),b=Math.max(ct[0],ct[1]);a=Math.max(a,cl[0]);b=Math.min(b,cl[1]);if(b>a)c=[add(Lg.P,mul(Lg.u,a)),add(Lg.P,mul(Lg.u,b))];}}
  return {poly,c};
}
function sameLine(a,b){let da=((a.a-b.a)%180+180)%180;if(da>90)da=180-da;if(da>0.05)return false;return Math.abs(dot(a.n,sub(b.P,a.P)))<0.05;}
function commonMap(name){
  const G=geom(st.runes[name]),res={};
  for(const o of ALLF()){if(o===name)continue;const G2=geom(st.runes[o]);
    for(const id in G)for(const id2 in G2)if(sameLine(G[id],G2[id2])){(res[id]=res[id]||[]).push(o+(id2!==id?' ('+id2+')':''));break;}}
  return res;
}

/* ====== Kreslení ====== */
function content(name){
  const D=st.deck,r=st.runes[name],G=geom(r),O=org(),R=rectM();
  const X=p=>f3(O.ox+p[0]),Y=p=>f3(O.oy-p[1]);
  const seg=(a,b,extra='')=>`<line x1="${X(a)}" y1="${Y(a)}" x2="${X(b)}" y2="${Y(b)}"${extra}/>`;
  let bands='',thins='',rune='',center='',errs=[];
  const lineSegs={};
  for(const id in G){const g=G[id];
    const offs=g.type==='pas'?(D.bandN<=1?[0]:Array.from({length:D.bandN},(_,i)=>-D.bandW/2+i*D.bandW/(D.bandN-1))):[0];
    for(const o of offs){const P=add(g.P,mul(g.n,o)),c=segClip(P,g.u,R);if(!c)continue;
      const el=seg(add(P,mul(g.u,c[0])),add(P,mul(g.u,c[1])));if(g.type==='pas')bands+=el;else thins+=el;}
    const c=segClip(g.P,g.u,R);if(c)lineSegs[id]=[add(g.P,mul(g.u,c[0])),add(g.P,mul(g.u,c[1]))];
  }
  const joined=new Set(r.strokes.map(s=>s.on));
  r.strokes.forEach((s,i)=>{const sh=strokeShape(s,G,R,joined);if(sh.err){errs[i]=sh.err;return;}
    if(sh.poly.length>2)rune+=`<path d="M${sh.poly.map(p=>X(p)+','+Y(p)).join(' L')} Z"/>`;
    if(sh.c)center+=seg(sh.c[0],sh.c[1]);});
  return {bands,thins,rune,center,G,O,R,X,Y,seg,lineSegs,errs};
}
function frameEls(){const D=st.deck,x=D.mL,y=D.mT,w=D.cardW-D.mL-D.mR,h=D.cardH-D.mT-D.mB,i=+D.inner,r=+D.radius;
  let s=`<rect x="${x}" y="${y}" width="${f3(w)}" height="${f3(h)}" rx="${r}"/>`;
  if(i>0&&w>2*i&&h>2*i)s+=`<rect x="${f3(x+i)}" y="${f3(y+i)}" width="${f3(w-2*i)}" height="${f3(h-2*i)}" rx="${f3(Math.max(0,r-i))}"/>`;return s;}
function clipDef(cid){const D=st.deck;return `<clipPath id="${cid}"><rect x="${D.mL}" y="${D.mT}" width="${f3(D.cardW-D.mL-D.mR)}" height="${f3(D.cardH-D.mT-D.mB)}" rx="${D.radius}"/></clipPath>`;}
// vrstvy pro export (id skupin = názvy vrstev v Illustratoru, inkscape:label v Inkscapu)
function layers(name,cid){
  const D=st.deck,c=content(name),cp=+D.radius>0?` clip-path="url(#${cid})"`:'';
  const lay=(id,attrs,inner)=>`<g id="${id}" inkscape:groupmode="layer" inkscape:label="${id}" ${attrs}>${inner}</g>`;
  return (+D.radius>0?`<defs>${clipDef(cid)}</defs>`:'')+
    lay(`${name}-pozadi`,`fill="${D.bg}"`,`<rect width="${D.cardW}" height="${D.cardH}"/>`)+
    lay(`${name}-ram`,`fill="none" stroke="${D.ink}" stroke-width="${D.frameW}"`,frameEls())+
    lay(`${name}-pasy`,`fill="none" stroke="${D.ink}" stroke-width="${D.bandS}"${cp}`,c.bands)+
    lay(`${name}-cary`,`fill="none" stroke="${D.ink}" stroke-width="${D.thinS}"${cp}`,c.thins)+
    lay(`${name}-runa`,`fill="${D.ink}" stroke="none"${cp}`,c.rune)+
    lay(`${name}-runa-stred`,`fill="none" stroke="${D.bg}" stroke-width="${D.gap}" stroke-linecap="round"${cp}`,c.center);
}
function svgFile(names){
  const D=st.deck,cols=names.length>1?5:1,gap=5,rows=Math.ceil(names.length/cols);
  const W=cols*D.cardW+(cols-1)*gap,H=rows*D.cardH+(rows-1)*gap;
  let body='';names.forEach((n,i)=>{const x=(i%cols)*(D.cardW+gap),y=Math.floor(i/cols)*(D.cardH+gap);
    const inner=layers(n,'clip-'+n);body+=names.length>1?`<g id="${n}" inkscape:groupmode="layer" inkscape:label="${n}" transform="translate(${x} ${y})">${inner}</g>`:inner;});
  return `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="${W}mm" height="${H}mm" viewBox="0 0 ${W} ${H}">\n${body}\n</svg>\n`;
}
function thumb(name){const D=st.deck,c=content(name);
  return `<svg viewBox="0 0 ${D.cardW} ${D.cardH}"><rect width="${D.cardW}" height="${D.cardH}" fill="#fff"/><g fill="none" stroke="#000" stroke-width="0.5">${frameEls()}</g><g stroke="#999" stroke-width="0.3">${c.bands}${c.thins}</g><g fill="#000">${c.rune}</g></svg>`;}

const cv=document.getElementById('cv');let LAST=null;
function draw(){
  const D=st.deck,c=content(st.cur);LAST=c;
  cv.setAttribute('viewBox',`0 0 ${D.cardW} ${D.cardH}`);
  let s=`<defs>${clipDef('cvclip')}</defs><rect width="${D.cardW}" height="${D.cardH}" fill="${D.bg}" stroke="#ccc" stroke-width="0.2"/>`;
  if(ui.img)s+=`<image href="${ui.img}" x="0" y="0" width="${D.cardW}" height="${f3(D.cardW*ui.imgRatio)}" opacity="${ui.imgOp}" preserveAspectRatio="none"/>`;
  if(ui.grid){const R=c.R,O=c.O;let g='';for(let x=Math.ceil(R.x0);x<=R.x1;x++)g+=`<line x1="${f3(O.ox+x)}" y1="${D.mT}" x2="${f3(O.ox+x)}" y2="${f3(D.cardH-D.mB)}" stroke-width="${x%5?0.04:0.1}"/>`;
    for(let y=Math.ceil(R.y0);y<=R.y1;y++)g+=`<line x1="${D.mL}" y1="${f3(O.oy-y)}" x2="${f3(D.cardW-D.mR)}" y2="${f3(O.oy-y)}" stroke-width="${y%5?0.04:0.1}"/>`;
    s+=`<g stroke="#2a6fd1" opacity="0.5">${g}</g>`;}
  if(ui.all){let g='';for(const n of ALLF()){if(n===st.cur)continue;const o=content(n);for(const id in o.lineSegs){const [a,b]=o.lineSegs[id];g+=c.seg(a,b);}}
    s+=`<g stroke="#2a6fd1" stroke-width="0.5" opacity="0.12" clip-path="url(#cvclip)">${g}</g>`;}
  if(ui.ghost&&ui.ghost!==st.cur){const o=content(ui.ghost);s+=`<g opacity="0.35" clip-path="url(#cvclip)"><g stroke="#d2541b" stroke-width="${D.bandS}">${o.bands}${o.thins}</g><g fill="#d2541b">${o.rune}</g></g>`;}
  const cp=' clip-path="url(#cvclip)"';
  s+=`<g fill="none" stroke="${D.ink}" stroke-width="${D.frameW}">${frameEls()}</g>`;
  s+=`<g stroke="${D.ink}" stroke-width="${D.bandS}"${cp}>${c.bands}</g><g stroke="${D.ink}" stroke-width="${D.thinS}"${cp}>${c.thins}</g>`;
  s+=`<g fill="${D.ink}"${cp}>${c.rune}</g><g stroke="${D.bg}" stroke-width="${D.gap}" stroke-linecap="round"${cp}>${c.center}</g>`;

  if(ui.labels){let g='';for(const id in c.lineSegs){const b=c.lineSegs[id][1],x=c.X(b),y=c.Y(b);const tx=Math.min(Math.max(x,D.mL+1),D.cardW-D.mR-1),ty=Math.min(Math.max(y,D.mT+2),D.cardH-D.mB-0.5);
    g+=`<text x="${tx}" y="${ty}" font-size="2" fill="${id===ui.sel?'#d2541b':'#2a6fd1'}" stroke="#fff" stroke-width="0.4" paint-order="stroke" text-anchor="${tx>c.O.ox?'end':'start'}">${id}</text>`;}s+=`<g font-family="system-ui,sans-serif" font-weight="600" style="pointer-events:none">${g}</g>`;}

  s+=`<g stroke="transparent" stroke-width="2.2" style="cursor:${ui.fill?'cell':'move'}">${hit}</g>`;

function onEdit(e,isCommit){
  const t=e.target,D=st.deck;
  if(t.dataset.deck){const k=t.dataset.deck;D[k]=(t.type==='number')?(parseFloat(t.value)||0):t.value;if(k==='bandN')D[k]=Math.max(1,Math.round(D[k]));draw();if(isCommit){commit();drawGallery();}return;}
  if(t.dataset.ui){const k=t.dataset.ui;ui[k]=t.type==='checkbox'?t.checked:t.value;draw();return;}
  const tr=t.closest('tr');if(!tr)return;const r=cur();
  if(tr.dataset.i!=null&&t.dataset.k){const l=r.lines[+tr.dataset.i],k=t.dataset.k;
    if(k==='id'){if(!isCommit)return;let nid=t.value.replace(/[^A-Za-z0-9_-]/g,'')||l.id;if(nid!==l.id&&r.lines.some(x=>x.id===nid))nid=l.id;
      const old=l.id;l.id=nid;r.lines.forEach(x=>{if(x.ref===old)x.ref=nid});r.strokes.forEach(s=>{if(s.on===old)s.on=nid;['from','to'].forEach(w=>{if(s[w].id===old)s[w].id=nid})});if(ui.sel===old)ui.sel=nid;}
    else if(k==='ref'){const G=geom(r),g=G[l.id];
      if(t.value){const R2=G[t.value];l.ref=t.value;l.off=g&&R2?f3(dot(R2.n,sub(g.P,R2.P))):0;}   // zachová polohu, pokud je rovnoběžná
      else{if(g){l.x=f3(g.P[0]);l.y=f3(g.P[1]);l.a=f3(g.a);}l.ref='';}}
    else if(k==='type')l.type=t.value;
    else l[k]=parseFloat(t.value)||0;
    ui.sel=l.id;
  }else if(tr.dataset.s!=null&&t.dataset.sk){const s=r.strokes[+tr.dataset.s],k=t.dataset.sk;
    if(k==='on')s.on=t.value;
    else{const [w,f]=k.split('.');
      if(f==='kind'){if(t.value==='#'){const G=geom(r),tt=G[s.on]?tOn(G[s.on],s[w],G):0;s[w]={kind:'len',t:f3(tt==null?0:tt)};}else s[w]={kind:'line',id:t.value.slice(2),edge:s[w].edge||'mid'};}
      else if(f==='t')s[w].t=parseFloat(t.value)||0;else s[w].edge=t.value;}
  }

}

function selLine(){return cur().lines.find(l=>l.id===ui.sel);}
function act(a,el){
  const r=cur(),l=selLine(),G=geom(r),g=l&&G[l.id];
  switch(a){
    case 'undo':return undo(-1);case 'redo':return undo(1);
    case 'addPas':case 'addCara':{const id=uniqId(a==='addPas'?'P':'C');r.lines.push(L(id,a==='addPas'?'pas':'cara',0,0,90));ui.sel=id;break;}
    case 'addPar':{if(!l)return alert('Nejdřív vyber čáru.');const id=uniqId(l.id+'_');r.lines.push(L(id,l.type,0,0,0,{ref:l.id,off:4}));ui.sel=id;break;}

      if(used.length&&!confirm(`Čáru ${l.id} používá: ${used.join(', ')}. Smazat i tak? (rovnoběžky se převedou na samostatné čáry, tahy na ní se smažou)`))return;
      r.lines.forEach(x=>{if(x.ref===l.id){const gx=G[x.id];Object.assign(x,{ref:'',x:f3(gx.P[0]),y:f3(gx.P[1]),a:f3(gx.a)});}});
      r.strokes=r.strokes.filter(s=>s.on!==l.id);r.strokes.forEach(s=>['from','to'].forEach(w=>{if(s[w].kind==='line'&&s[w].id===l.id){const tt=tOn(G[s.on],s[w],G);s[w]={kind:'len',t:f3(tt||0)};}}));
      r.lines=r.lines.filter(x=>x!==l);ui.sel=null;break;}
    case 'addS':{if(!l)return alert('Nejdřív vyber čáru, na které tah leží.');r.strokes.push(S(l.id,at(-10),at(10)));break;}
    case 'delS':r.strokes.splice(+el.dataset.s2,1);break;

    case 'resetDeck':st.deck={...DECK0};break;
    case 'newRune':case 'renameRune':{
      const old=a==='renameRune'?st.cur:null;
      let n=prompt(old?`Nový název runy ${old}:`:'Název nové runy (písmena, číslice, pomlčka):',old||'');if(n==null)return;
      n=n.trim().replace(/\s+/g,'-').replace(/[^\p{L}\p{N}_-]/gu,'');
      if(!n||/^\p{N}/u.test(n))return alert('Název musí začínat písmenem.');
      if(st.runes[n])return alert(`Runa ${n} už existuje.`);
      st.custom=st.custom||[];
      if(old){st.runes[n]=st.runes[old];delete st.runes[old];st.custom[st.custom.indexOf(old)]=n;if(ui.ghost===old)ui.ghost='';}
      else{const base=confirm(`Začít jako kopie aktuální runy ${st.cur}?\n\nOK = kopie ${st.cur}, Zrušit = prázdná karta`);
        st.runes[n]=base?clone(st.runes[st.cur]):{lines:[],strokes:[]};st.custom.push(n);}
      st.cur=n;ui.sel=null;break;}
    case 'delRune':{if(!confirm(`Smazat runu ${st.cur}? (Krok zpět ji vrátí.)`))return;const n=st.cur;delete st.runes[n];st.custom=st.custom.filter(x=>x!==n);if(ui.ghost===n)ui.ghost='';st.cur='Berkana';ui.sel=null;break;}
    case 'expOne':return dl(`runa-${st.cur}.svg`,svgFile([st.cur]),'image/svg+xml');
    case 'expAll':return dl('runy-arch.svg',svgFile(ALLF()),'image/svg+xml');
    case 'expEach':ALLF().forEach((n,i)=>setTimeout(()=>dl(`runa-${n}.svg`,svgFile([n]),'image/svg+xml'),i*300));return;
    case 'saveJson':return dl('runove-karty.json',JSON.stringify(st,null,1),'application/json');

function mmAt(e){const p=cv.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(cv.getScreenCTM().inverse());const O=org();return [q.x-O.ox,O.oy-q.y];}

// Vyplnění úseku: klik na pás → tah runy mezi nejbližšími křížícími čarami po obou stranách; klik na vyplněný úsek ho smaže
function edgeFor(oid,Lg,t,G,r){const M=G[oid];if(M.type!=='pas')return 'mid';
  const tx=dot(sub(add(Lg.P,mul(Lg.u,t)),M.P),M.u),tol=M.h+Lg.h;
  for(const s of r.strokes){if(s.on!==oid)continue;const a=tOn(M,s.from,G),b=tOn(M,s.to,G);if(a==null||b==null)continue;
    const lo=Math.min(a,b),hi=Math.max(a,b);if(tx>lo+tol&&tx<hi-tol)return 'mid';if(tx>=lo-tol&&tx<=hi+tol)return 'far';}
  return 'mid';}   // napojení doprostřed jiného tahu = střed, na konec jiného tahu (roh) = vzdálenější hrana
function fillAt(id,m){
  const r=cur(),G=geom(r),Lg=G[id];if(!Lg)return false;const t=dot(sub(m,Lg.P),Lg.u);
  for(let i=0;i<r.strokes.length;i++){const s=r.strokes[i];if(s.on!==id)continue;const a=tOn(Lg,s.from,G),b=tOn(Lg,s.to,G);
    if(a!=null&&b!=null&&t>=Math.min(a,b)&&t<=Math.max(a,b)){r.strokes.splice(i,1);return true;}}

  for(const oid in G){if(oid===id)continue;const tt=tOn(Lg,{kind:'line',id:oid},G);if(tt==null||(cl&&(tt<cl[0]||tt>cl[1])))continue;
    if(tt<t&&(!lo||tt>lo.t))lo={t:tt,id:oid};if(tt>t&&(!hi||tt<hi.t))hi={t:tt,id:oid};}
  const stop=(x,end)=>x?{kind:'line',id:x.id,edge:edgeFor(x.id,Lg,x.t,G,r)}:{kind:'len',t:f3(cl?cl[end]:(end?30:-30))};
  r.strokes.push({on:id,from:stop(lo,0),to:stop(hi,1)});return true;}
cv.addEventListener('dblclick',e=>{const id=e.target.dataset&&e.target.dataset.id;if(!id||ui.fill)return;ui.sel=id;if(fillAt(id,mmAt(e))){commit();refreshAll();}});
