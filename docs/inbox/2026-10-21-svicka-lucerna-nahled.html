<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Svíčka a lucerna</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Cormorant+Garamond:ital@0;1&display=swap">
<style>
:root{--bg:#0a0c12;--card:#12161f;--gold:#FFBF00;--muted:#8ba5c0}
body{margin:0;background:var(--bg);color:var(--muted);font-family:'Cormorant Garamond',Georgia,serif;padding:20px 16px 40px}
h1{font-family:Cinzel,serif;color:var(--gold);font-size:15px;letter-spacing:3px;font-weight:400;margin:0 0 6px}
h2{font-family:Cinzel,serif;color:var(--gold);font-size:13px;letter-spacing:2.5px;font-weight:400;margin:28px 0 8px}
p.n{font-style:italic;max-width:760px;line-height:1.5;margin:4px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;max-width:1100px}
.box{background:var(--card);border:1px solid rgba(46,74,112,.5);padding:16px}
.box h3{font-family:Cinzel,serif;font-size:11px;letter-spacing:2px;color:#D6A85C;font-weight:400;margin:0 0 4px}
.box .d{font-size:14px;font-style:italic;margin:0 0 14px;line-height:1.45}
.lbl{display:flex;align-items:center;gap:.5em;font-family:Cinzel,serif;font-size:.7em;letter-spacing:3px;color:var(--gold);margin:6px 0}
.lbl svg{width:1.6em;height:1.6em;flex:none;overflow:visible}
.zoom{font-size:44px;margin:14px 0 4px}
.sub{font-size:16px;font-style:italic;color:#aebfd2;margin-top:6px}
/* plamen, který se jemně chvěje (jen u variant označených „živá“) */
.zije .pl{transform-box:fill-box;transform-origin:50% 92%;animation:plamen 2.6s ease-in-out infinite}
@keyframes plamen{0%,100%{transform:scale(1,1) rotate(0)}25%{transform:scale(.93,1.06) rotate(-2deg)}55%{transform:scale(1.04,.95) rotate(1.5deg)}80%{transform:scale(.97,1.03) rotate(-1deg)}}
@media (prefers-reduced-motion:reduce){.zije .pl{animation:none}}
</style></head><body>
<h1>BEFORE WE BEGIN — SVÍČKA NEBO LUCERNA</h1>
<p class="n">CODE-tune 2026-10-21. Jen náhled. Tři svíčky a tři lucerny, tenká zlatá linka jako ikony záložek. Nahoře skutečná velikost nad
formulářem, pod tím zvětšené. „Živá“ = plamen se jemně chvěje (kdo má v telefonu vypnuté animace, uvidí ho v klidu).</p>
<h2>SVÍČKA</h2><div class="grid" id="sv"></div>
<h2>LUCERNA</h2><div class="grid" id="lu"></div>
<script>
var SV = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"';
var PL = function (cx, y, s) { s = s || 1;   // plamen: kapka s vrcholem nahoře, střed cx, spodek y
  return '<path class="pl" d="M' + cx + ' ' + (y - 6.6 * s) + 'c' + (1.6 * s) + ' ' + (2 * s) + ' ' + (2.2 * s) + ' ' + (3.3 * s) + ' ' + (2.2 * s) + ' ' + (4.4 * s)
    + 'a' + (2.2 * s) + ' ' + (2.2 * s) + ' 0 0 1-' + (4.4 * s) + ' 0c0-' + (1.1 * s) + ' ' + (0.6 * s) + '-' + (2.4 * s) + ' ' + (2.2 * s) + '-' + (4.4 * s) + 'z"/>'; };
var SVICKY = [
  ['A1 · Svíčka', 'Jednoduchá, jak byla v prvním náhledu.', false,
   '<path d="M9 11h6v9H9z"/><path d="M7 21h10"/><path d="M12 11V9.6"/>' + PL(12, 9.6)],
  ['A2 · Svíčka na misce', 'Svíčka stojí na mělké misce, po straně stéká vosk — víc „obřadní“.', false,
   '<path d="M9.5 11.5h5v8.5h-5z"/><path d="M13.2 11.5v2.6"/><path d="M5.5 20h13"/><path d="M7 20c.4 1.2 2 1.8 5 1.8s4.6-.6 5-1.8"/><path d="M12 11.5V10"/>' + PL(12, 10)],
  ['A3 · Svíčka, živá', 'Jako A1, kolem plamene tři krátké paprsky světla a plamen se chvěje.', true,
   '<path d="M9 11h6v9H9z"/><path d="M7 21h10"/><path d="M12 11V9.6"/>' + PL(12, 9.6) + '<path d="M12 .9v1M7.4 3.2l.8.6M16.6 3.2l-.8.6" stroke-width="1.1"/>']
];
var LUCERNY = [
  ['C1 · Lucerna', 'Jak byla v prvním náhledu: stříška, sklo s plamenem, podstavec.', false,
   '<path d="M12 2.5v1.5"/><path d="M9.5 4h5l1.2 2H8.3z"/><path d="M8.5 6h7v11h-7z"/><path d="M7.5 17h9l-.9 2.5H8.4z"/>' + PL(12, 13.4, .64)],
  ['C2 · Lucerna na kroužku', 'Závěsný kroužek nahoře a dvě příčky skla — víc jako Rúnarova lucerna na portrétu.', false,
   '<path d="M12 4.4a1.4 1.4 0 1 1 0-2.8 1.4 1.4 0 0 1 0 2.8z"/><path d="M9 4.4h6l1.4 2.2H7.6z"/><path d="M8.2 6.6h7.6v10.6H8.2z"/><path d="M8.2 9h7.6M8.2 14.8h7.6" stroke-width="1"/><path d="M7.2 17.2h9.6l-1 2.6H8.2z"/>' + PL(12, 14, .62)],
  ['C3 · Lucerna, živá', 'Jako C1, po stranách světlo a plamen uvnitř se chvěje.', true,
   '<path d="M12 2.5v1.5"/><path d="M9.5 4h5l1.2 2H8.3z"/><path d="M8.5 6h7v11h-7z"/><path d="M7.5 17h9l-.9 2.5H8.4z"/>' + PL(12, 13.4, .64) + '<path d="M4.4 11.5h1.6M18 11.5h1.6M5.2 7.6l1.3.8M18.8 7.6l-1.3.8" stroke-width="1.1"/>']
];
function vykresli(kam, seznam) {
  var g = document.getElementById(kam);
  seznam.forEach(function (v) {
    var ik = '<svg ' + SV + (v[2] ? ' class="zije"' : '') + '>' + v[3] + '</svg>';
    var el = document.createElement('div'); el.className = 'box';
    el.innerHTML = '<h3>' + v[0] + '</h3><p class="d">' + v[1] + '</p>'
      + '<div class="lbl">' + ik + 'BEFORE WE BEGIN</div><div class="sub">Tell me where to look. The rune speaks for itself.</div>'
      + '<div class="lbl zoom">' + ik + '</div>';
    g.appendChild(el);
  });
}
vykresli('sv', SVICKY); vykresli('lu', LUCERNY);
</script>
</body></html>
